# =============================================================================
# Docker Compose Configuration for RAG Chatbot System
# =============================================================================
# Services:
#   - rag-api: FastAPI REST API for RAG chatbot
#   - chromadb: Vector database for document embeddings
#   - mcp-server: Model Context Protocol server for AI assistants
#   - redis: Optional caching layer for sessions
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # RAG API Service
  # ---------------------------------------------------------------------------
  rag-api:
    container_name: rag-api
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rag-chatbot-api:latest
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    # ponytail: env_file instead of a hand-kept whitelist. The old list silently
    # dropped LLM_MAX_TOKENS, OLLAMA_KEEP_ALIVE, USE_RERANKER, CHUNK_* etc.
    env_file:
      - .env
    environment:
      # Container-specific overrides only (these must differ from .env)
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_IN_MEMORY=false
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      # Mount documents directory for ingestion
      - ./documents:/app/documents:rw
      # Mount data directory for persistence
      - rag-data:/app/data:rw
      # Mount logs directory
      - rag-logs:/app/logs:rw
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - rag-network

  # ---------------------------------------------------------------------------
  # ChromaDB Vector Database
  # ---------------------------------------------------------------------------
  chromadb:
    container_name: chromadb
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_HOST_PORT:-8000}:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=${CHROMA_ANONYMIZED_TELEMETRY:-TRUE}
    volumes:
      - chroma-data:/chroma/chroma:rw
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - rag-network

  # ---------------------------------------------------------------------------
  # MCP Server for AI Assistant Integration
  # ---------------------------------------------------------------------------
  mcp-server:
    container_name: mcp-server
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    image: rag-chatbot-mcp:latest
    ports:
      - "${MCP_HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Container-specific overrides only
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - MCP_SERVER_PORT=3000
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_IN_MEMORY=false
    volumes:
      # Mount data directory
      - mcp-data:/app/data:rw
      # Mount logs directory
      - mcp-logs:/app/logs:rw
    depends_on:
      - rag-api
      - chromadb
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - rag-network

  # ---------------------------------------------------------------------------
  # Redis Cache (Optional)
  # ---------------------------------------------------------------------------
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data:rw
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - rag-network

# =============================================================================
# Named Volumes for Data Persistence
# =============================================================================
volumes:
  # ChromaDB vector store data
  chroma-data:
    driver: local
  
  # RAG API data and uploaded documents
  rag-data:
    driver: local
  
  # RAG API logs
  rag-logs:
    driver: local
  
  # MCP server data
  mcp-data:
    driver: local
  
  # MCP server logs
  mcp-logs:
    driver: local
  
  # Redis persistence
  redis-data:
    driver: local

# =============================================================================
# Docker Network
# =============================================================================
networks:
  rag-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
